name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Test release publication gates
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Test, lint and compile debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify APK version and signature
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-metadata.txt"
          head -1 "$RUNNER_TEMP/apk-metadata.txt"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          metadata = (Path(os.environ['RUNNER_TEMP']) / 'apk-metadata.txt').read_text().splitlines()[0]
          for key, value in {'name': 'lt.krutas.devboard', 'versionName': '0.3', 'versionCode': '9'}.items():
              match = re.search(rf"\b{key}='([^']*)'", metadata)
              assert match and match.group(1) == value, f'Wrong APK metadata: {metadata}'
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DevBoard-v0.3-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
