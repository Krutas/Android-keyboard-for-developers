name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test shared keyboard mapping
        run: |
          swiftc ios/Shared/KeyboardMapping.swift tests/MappingTests.swift -o "$RUNNER_TEMP/mapping-tests"
          "$RUNNER_TEMP/mapping-tests"
      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate
      - name: Build and package iOS Simulator app
        run: |
          set -euo pipefail
          xcodebuild -project ios/DevBoard.xcodeproj -scheme DevBoard -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DevBoardSimulator" CODE_SIGNING_ALLOWED=NO build
          mkdir -p releases
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/DevBoardSimulator/Build/Products/Release-iphonesimulator/DevBoard.app" \
            "releases/DevBoard-iOS-v0.3-Simulator.zip"
      - name: Build and package unsigned iPhone IPA
        run: |
          set -euo pipefail
          xcodebuild -project ios/DevBoard.xcodeproj -scheme DevBoard -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DevBoardDevice" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/DevBoardDevice/Build/Products/Release-iphoneos/DevBoard.app"
          test -d "$app/PlugIns/DevBoardKeyboard.appex"
          mkdir -p "$RUNNER_TEMP/DevBoardPayload/Payload"
          ditto "$app" "$RUNNER_TEMP/DevBoardPayload/Payload/DevBoard.app"
          (cd "$RUNNER_TEMP/DevBoardPayload" && zip -q -r \
            "$GITHUB_WORKSPACE/releases/DevBoard-iOS-v0.3-unsigned.ipa" Payload)
          unzip -l releases/DevBoard-iOS-v0.3-unsigned.ipa | grep -F \
            "Payload/DevBoard.app/PlugIns/DevBoardKeyboard.appex/Info.plist"
      - name: Verify iOS app and extension versions
        run: |
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          roots = [Path(os.environ['RUNNER_TEMP']) / folder / 'Build/Products' / product / 'DevBoard.app'
                   for folder, product in [('DevBoardDevice', 'Release-iphoneos'), ('DevBoardSimulator', 'Release-iphonesimulator')]]
          for target in [p for root in roots for p in [root / 'Info.plist', root / 'PlugIns/DevBoardKeyboard.appex/Info.plist']]:
              metadata = plistlib.loads(target.read_bytes())
              version = metadata.get('CFBundleShortVersionString')
              build = metadata.get('CFBundleVersion')
              print(f'{target}: {version} ({build})')
              assert version == '0.3' and build == '5', f'Wrong iOS metadata: {target}: {version} ({build})'
          PY
      - name: Upload iOS packages
        uses: actions/upload-artifact@v4
        with:
          name: DevBoard-iOS-v0.3
          path: |
            releases/DevBoard-iOS-v0.3-Simulator.zip
            releases/DevBoard-iOS-v0.3-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
